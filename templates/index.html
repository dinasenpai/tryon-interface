<style type="text/tailwindcss">
    :root {
      --primary-color: #3d98f4;
      --secondary-color: #101a23;
      --accent-color: #223649;
      --text-primary: #ffffff;
      --text-secondary: #b0c7de;
      --border-color: #223649;
    }
    .preset-image-container {
      @apply relative cursor-pointer transition-all duration-200 ease-in-out;
    }
    .preset-image-container:hover .preset-image-overlay {
      @apply opacity-70;
    }
    .preset-image-container.selected .preset-image-overlay {
      @apply opacity-100;
    }
    .preset-image-container.selected {
      @apply ring-2 ring-[var(--primary-color)] ring-offset-2 ring-offset-[var(--secondary-color)] rounded-lg;
    }
    .preset-image-overlay {
      @apply absolute inset-0 bg-[var(--primary-color)] opacity-0 rounded-lg flex items-center justify-center transition-opacity duration-200 ease-in-out;
    }
    .preset-image-check {
      @apply text-white opacity-0;
    }
    .preset-image-container.selected .preset-image-check {
      @apply opacity-100;
    }
  </style>
</head>

  <span class="text-xl font-bold">Processing... Please wait</span>
</div>
<!-- Result image display -->
<div id="resultContainer" style="display:none;position:fixed;z-index:10000;top:0;left:0;width:100vw;height:100vh;background:rgba(16,26,35,0.98);color:#fff;align-items:center;justify-center;flex-direction:column;" class="flex flex-col items-center justify-center">
  <span class="text-xl font-bold mb-4">Your Virtual Try-On Result</span>
  <img id="resultImage" src="" alt="Result" class="rounded-lg shadow-lg max-w-[90vw] max-h-[70vh] border-4 border-[var(--primary-color)]"/>
  <button onclick="document.getElementById('resultContainer').style.display='none';" class="mt-8 px-6 py-2 rounded-lg bg-[var(--primary-color)] text-white font-bold hover:opacity-90 transition-opacity">Close</button>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const presetImages = document.querySelectorAll('.preset-image-container');
      const selectedUpperApparelInput = document.getElementById('selectedUpperApparel');
      const selectedLowerApparelInput = document.getElementById('selectedLowerApparel');
      const modelImageInput = document.getElementById('model-image-upload');
      const modelImageFilenameSpan = document.getElementById('model-image-filename');
      const tryOnForm = document.getElementById('tryOnForm');
      presetImages.forEach(container => {
        container.addEventListener('click', () => {
          const apparelType = container.dataset.apparelType;
          const imageUrl = container.dataset.imageUrl;
          const section = container.closest('section');
          if (section) {

            section.querySelectorAll('.preset-image-container.selected').forEach(selectedContainer => {
              if (selectedContainer !== container) {
                selectedContainer.classList.remove('selected');
              }
            });
          }
          container.classList.toggle('selected');
          if (container.classList.contains('selected')) {
            if (apparelType === 'upper') {
              selectedUpperApparelInput.value = imageUrl;
            } else if (apparelType === 'lower') {
              selectedLowerApparelInput.value = imageUrl;
            }
          } else {
             if (apparelType === 'upper') {
              selectedUpperApparelInput.value = '';
            } else if (apparelType === 'lower') {
              selectedLowerApparelInput.value = '';
            }
          }
        });
      });
      const uploadLabel = document.querySelector('label[for="model-image-upload"]');
      uploadLabel.addEventListener('dragover', (event) => {
        event.preventDefault();
        uploadLabel.classList.add('border-[var(--primary-color)]', 'bg-opacity-40');
      });
      uploadLabel.addEventListener('dragleave', () => {
        uploadLabel.classList.remove('border-[var(--primary-color)]', 'bg-opacity-40');
      });
      uploadLabel.addEventListener('drop', (event) => {
        event.preventDefault();
        uploadLabel.classList.remove('border-[var(--primary-color)]', 'bg-opacity-40');
        if (event.dataTransfer.files.length) {
          modelImageInput.files = event.dataTransfer.files;
          const fileName = event.dataTransfer.files[0].name;
          modelImageFilenameSpan.textContent = fileName.length > 20 ? fileName.substring(0, 17) + '...' : fileName;
        }
      });
      modelImageInput.addEventListener('change', () => {
        if (modelImageInput.files.length) {
          const fileName = modelImageInput.files[0].name;
          modelImageFilenameSpan.textContent = fileName.length > 20 ? fileName.substring(0, 17) + '...' : fileName;
        } else {
          modelImageFilenameSpan.textContent = 'Select File';
        }
      });
      tryOnForm.addEventListener('submit', async (event) => {
        event.preventDefault(); // Prevent default form submission
        const formData = new FormData();
        formData.append('selected_upper_apparel', selectedUpperApparelInput.value);
        formData.append('selected_lower_apparel', selectedLowerApparelInput.value);
        if (modelImageInput.files.length > 0) {
            formData.append('model_image', modelImageInput.files[0]);
        } else {
            alert('Please upload a model image.');
            return;
        }
        if (!selectedUpperApparelInput.value && !selectedLowerApparelInput.value) {
            alert('Please select at least one apparel item.');
            return;
        }
        // Show loading overlay
        document.getElementById('loadingOverlay').style.display = 'flex';
        try {
            const response = await fetch('/process', {
                method: 'POST',
                body: formData,
            });
            if (response.ok) {
                const result = await response.json();
                if (result.result_url) {
                    // Hide loading, show result
                    document.getElementById('loadingOverlay').style.display = 'none';
                    document.getElementById('resultImage').src = result.result_url;
                    document.getElementById('resultContainer').style.display = 'flex';
                    // Optionally reset form
                    // tryOnForm.reset();
                    // modelImageFilenameSpan.textContent = 'Select File';
                    // document.querySelectorAll('.preset-image-container.selected').forEach(c => c.classList.remove('selected'));
                    // selectedUpperApparelInput.value = '';
                    // selectedLowerApparelInput.value = '';
                } else if (result.error) {
                    document.getElementById('loadingOverlay').style.display = 'none';
                    alert(result.error);
                }
            } else {
                document.getElementById('loadingOverlay').style.display = 'none';
                alert('There was an error submitting your request. Please try again.');
            }
        } catch (error) {
            document.getElementById('loadingOverlay').style.display = 'none';
            alert('An unexpected error occurred. Please try again.');
        }
      });
    });
  </script>
